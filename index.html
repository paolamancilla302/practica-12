<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Store | Armería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#" onclick="irATienda(); return false;">
                🎯 Tactical <span class="brand-accent">Store</span>
            </a>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-light btn-sm" onclick="irATienda()">Catálogo</button>
                <button class="btn btn-warning btn-sm" onclick="irAAdmin()">Admin</button>
            </div>
        </div>
    </nav>

    <main id="vistaPublica" class="container py-4">
        <div class="row mb-4 g-2">
            <div class="col-md-4">
                <select id="filtroCat" class="form-select" onchange="pintarCatalogo()">
                    <option value="todas">Todas las categorías</option>
                </select>
            </div>
            <div class="col-md-8">
                <input id="buscador" type="text" class="form-control" placeholder="Buscar por nombre..."
                    oninput="pintarCatalogo()">
            </div>
        </div>
        <div id="grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
        <div id="aviso" class="alert alert-danger mt-3 d-none"></div>
    </main>

    <main id="vistaAdmin" class="container py-4 d-none">

        <section id="panelLogin" class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-3">Acceso Administrador</h2>
                        <form onsubmit="login(event)">
                            <div class="mb-2">
                                <label class="form-label">Usuario</label>
                                <input id="usuario" type="text" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input id="password" type="password" class="form-control" required>
                            </div>
                            <button class="btn btn-warning w-100" type="submit">Ingresar</button>
                            <p id="msgLogin" class="text-danger small mt-2 mb-0"></p>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- Panel CRUD -->
        <section id="panelAdmin" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Gestión de Productos</h2>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary btn-sm" onclick="irATienda()">Ver tienda</button>
                    <button class="btn btn-danger btn-sm" onclick="logout()">Cerrar sesión</button>
                </div>
            </div>

            <form id="formProd" class="row g-2 mb-4 p-3 bg-light rounded shadow-sm" onsubmit="guardarProducto(event)">
                <input type="hidden" id="id">
                <div class="col-md-4"><input id="nombre" class="form-control" placeholder="Nombre" required></div>
                <div class="col-md-8"><input id="descripcion" class="form-control" placeholder="Descripción" required>
                </div>
                <div class="col-md-3"><input id="precio" type="number" step="0.01" class="form-control"
                        placeholder="Precio" required></div>
                <div class="col-md-3"><input id="stock" type="number" class="form-control" placeholder="Stock" required>
                </div>
                <div class="col-md-3">
                    <input id="categoria" class="form-control" placeholder="Categoría" list="listaCat" required>
                    <datalist id="listaCat"></datalist>
                </div>
                <div class="col-md-3"><input id="imagen" class="form-control" placeholder="URL imagen (opcional)"></div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" id="btnGuardar" class="btn btn-success">Agregar</button>
                    <button type="button" class="btn btn-outline-dark" onclick="resetForm()">Cancelar</button>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-dark table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="modal fade" id="modalDetalles" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">📋 Detalle del Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <img id="detImagen" src="" class="img-fluid rounded shadow-sm w-100" alt="Producto">
                        </div>
                        <div class="col-md-7">
                            <h4 id="detNombre" class="fw-bold mb-2"></h4>
                            <span id="detCategoria" class="badge bg-secondary mb-3"></span>
                            <p id="detDescripcion" class="text-muted"></p>
                            <hr>
                            <div class="row text-center">
                                <div class="col-6">
                                    <small class="text-muted d-block">Precio</small>
                                    <strong id="detPrecio" class="text-primary fs-5"></strong>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted d-block">Stock</small>
                                    <div id="detStock" class="fs-5"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted py-3 border-top mt-4">
        <small>Práctica #12 — Desarrollo Web | Proyecto educativo (demo)</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
